name: Release

# A tag builds the Mac app and attaches the .dmg to that tag's release.
# Run the same job by hand (Actions → Release → Run workflow) to get an
# unsigned build artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    # Apple silicon only: MediaPipe has no universal2 wheel, so a universal
    # bundle would have to build and lipo a second architecture by hand.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "backend[dev,faces,desktop]"

      - name: Tests
        run: cd backend && ../.venv/bin/python -m pytest -q

      # The app version comes from the tag; a manual run falls back to the
      # package version so the bundle always carries something sensible.
      - name: Resolve version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=0.1.0" >> "$GITHUB_OUTPUT" ;;
          esac

      # Builds the UI, draws the icon, freezes the .app, smoke-tests the frozen
      # service (it must answer /api/capabilities with faces enabled), then
      # signs ad-hoc and packs the .dmg.
      - name: Build Sharpen.app and .dmg
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
          SHARPEN_VERSION: ${{ steps.version.outputs.value }}
        run: bash desktop/build_macos.sh

      - name: Checksum
        run: shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: Sharpen-${{ steps.version.outputs.value }}-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          # Notes are generated once; a re-run of the same tag only refreshes the
          # asset, so the release body (and its install caveat) is not lost.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            changelog="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" -f target_commitish="$GITHUB_SHA" -q .body)"
            caveat='Unsigned build (Apple silicon). Drag **Sharpen** to Applications, then
          right-click it → **Open** the first time; Gatekeeper blocks a plain double-click
          until the app has been opened once.

          Everything runs on your machine: no uploads, no account. Verify the download with
          `SHA256SUMS`. Dependency and model licences are in `NOTICE.md`, also inside the
          app bundle.'
            gh release create "$GITHUB_REF_NAME" \
              --title "Sharpen $version" \
              --notes "$caveat"$'\n\n'"$changelog"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS --clobber
