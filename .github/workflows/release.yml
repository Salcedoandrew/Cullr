name: Release

# A tag builds the Mac app and attaches the .dmg to that tag's release.
# Run the same job by hand (Actions → Release → Run workflow) to get an
# unsigned build artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    # Apple silicon only: MediaPipe has no universal2 wheel, so a universal
    # bundle would have to build and lipo a second architecture by hand.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # Full history so the release notes can name the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # `semantic` is what lets the shipped app run the scene model: the
          # weights stay a first-use download, the runtime must be inside the
          # bundle. Cullr.spec collects it when it is installed here.
          #
          # `raw` is not optional in a shipped build. Without rawpy the app
          # still lists RAW files and promises to cull them, then rejects every
          # one as unreadable: 0.8.0 shipped without this extra and culled a
          # 3,016-frame wedding to 0 keepers. build_macos.sh asserts the
          # frozen app can decode a RAW, so removing it fails the build.
          .venv/bin/python -m pip install -e "backend[dev,faces,desktop,semantic,raw]"

      # Fails before the long build if the README's feature block (the source of
      # the release notes) has lost its markers.
      - name: Check release-note source
        run: python scripts/release_notes.py --check

      - name: Tests
        run: cd backend && ../.venv/bin/python -m pytest -q

      # The app version comes from the tag; a manual run falls back to the
      # package version so the bundle always carries something sensible.
      - name: Resolve version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
              echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "value=0.1.0" >> "$GITHUB_OUTPUT"
              echo "tag=v0.1.0" >> "$GITHUB_OUTPUT" ;;
          esac

      # Builds the UI, draws the icon, freezes the .app, smoke-tests the frozen
      # service (it must answer /api/capabilities with faces enabled), then
      # signs ad-hoc and packs the .dmg.
      - name: Build Cullr.app and .dmg
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
          CULLR_VERSION: ${{ steps.version.outputs.value }}
        run: bash desktop/build_macos.sh

      # Bare filenames, so `shasum -a 256 -c SHA256SUMS` works in the folder
      # the two files were downloaded into, not only from the repo root.
      - name: Checksum
        working-directory: dist
        run: shasum -a 256 *.dmg | tee SHA256SUMS

      # What the app's Check for updates reads, from the stable
      # .../releases/latest/download/update.json URL. Its hash comes out of
      # SHA256SUMS rather than being taken again here, so the manifest and the
      # checksum file cannot disagree, and the payload is validated by the
      # updater's own reader before it is written.
      - name: Update manifest
        run: |
          python3 scripts/update_manifest.py \
            --version "${{ steps.version.outputs.value }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --sums dist/SHA256SUMS \
            --dmg dist/*.dmg \
            --out dist/update.json

      - uses: actions/upload-artifact@v4
        with:
          name: Cullr-${{ steps.version.outputs.value }}-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS
            dist/update.json
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          # Notes are generated from the README's own feature section, so the
          # release can never say something the README does not. Generated once;
          # a re-run of the same tag only refreshes the asset, so the body is not
          # overwritten with different prose.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
            args=(--version "$version" --tag "$GITHUB_REF_NAME"
                  --repo "$GITHUB_REPOSITORY" --out dist/NOTES.md)
            if [ -n "$previous" ]; then args+=(--previous "$previous"); fi
            python scripts/release_notes.py "${args[@]}"
            gh release create "$GITHUB_REF_NAME" \
              --title "Cullr $version" \
              --notes-file dist/NOTES.md
          fi
          # update.json rides with the .dmg: the app checks the latest release for
          # it, so a release without one is a release the app cannot offer.
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.dmg dist/SHA256SUMS dist/update.json --clobber
