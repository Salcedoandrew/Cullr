[project]
name = "sharpen-culler"
version = "0.1.0"
description = "Local-first AI photo culling: quality scoring, blink detection and duplicate grouping"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10.1",
  "pillow-heif>=0.13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
]

[project.optional-dependencies]
faces = ["mediapipe>=0.10"]
raw = ["rawpy>=0.19"]
desktop = ["pywebview>=5.0", "pyinstaller>=6.0"]
dev = ["pytest>=8"]

[project.scripts]
cull = "culler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["culler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
